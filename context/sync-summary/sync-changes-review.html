<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Categra · Change Sync Review</title>
		<style>
			:root {
				--bg: #f9f8f8;
				--card: #ffffff;
				--card-alt: #f0f0f0;
				--border: #f0f0f0;
				--line: #e7e9ee;
				--ink: #3d505c;
				--muted: #737373;
				--muted2: #93989a;
				--icon: #9a8f88;
				--primary: #c59a78;
				--primary-fg: #f9f8f8;
				--secondary: #3d505c;
				--secondary-focus: #6c7880;
				--success: #68bea1;
				--alert: #e5b469;
				--alert-bg: #fff4cf;
				--destructive: #ec6052;
				--destructive-dark: #b21a1a;
				--ocean: #4a90e2;
				--chip: #fafafc;
				--input: #d0d5dd;
				--shadow: 0 14px 38px rgba(61, 80, 92, 0.08);
				--shadow-sm: 0 3px 12px rgba(61, 80, 92, 0.06);
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
			}
			body {
				margin: 0;
				font-family: Inter, 'Segoe UI', Arial, sans-serif;
				background: var(--bg);
				color: var(--ink);
				-webkit-font-smoothing: antialiased;
				overflow: hidden;
			}
			.mono {
				font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
			}
			.page {
				max-width: 1400px;
				width: 100%;
				height: 100vh;
				margin: 0 auto;
				padding: 18px 28px 16px;
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}
			/* ---------- top bar ---------- */
			.appbar {
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
				gap: 20px;
				margin-bottom: 16px;
				flex: none;
			}
			.brand {
				font-size: 21px;
				font-weight: 850;
				color: var(--secondary);
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.brand .pip {
				width: 11px;
				height: 11px;
				border-radius: 3px;
				background: var(--primary);
			}
			.sub {
				font-size: 12.5px;
				color: var(--muted);
				margin-top: 6px;
				max-width: 640px;
				line-height: 1.55;
			}
			.actions {
				display: flex;
				gap: 9px;
				flex: none;
				flex-wrap: wrap;
				justify-content: flex-end;
			}
			.btn {
				border: 1px solid var(--line);
				background: var(--card);
				border-radius: 10px;
				padding: 9px 13px;
				font-weight: 750;
				font-size: 12.5px;
				cursor: pointer;
				color: var(--ink);
				transition: 0.12s;
				white-space: nowrap;
			}
			.btn:hover {
				border-color: var(--input);
			}
			.btn.primary {
				background: var(--primary);
				color: var(--primary-fg);
				border-color: var(--primary);
			}
			.btn.primary:hover {
				filter: brightness(0.96);
			}
			.btn.danger {
				color: var(--destructive);
				border-color: var(--line);
			}
			.btn.danger:hover {
				color: var(--destructive-dark);
				border-color: var(--destructive);
				background: #fdf0ef;
			}
			.btn.small {
				padding: 5px 9px;
				font-size: 11px;
				border-radius: 8px;
			}
			.btn.ghost {
				background: transparent;
				border-color: transparent;
				color: var(--muted);
			}
			.btn.ghost:hover {
				background: var(--card-alt);
			}
			/* ---------- metrics ---------- */
			.cards {
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				gap: 13px;
				margin-bottom: 16px;
				flex: none;
			}
			.metric {
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: 14px;
				padding: 15px 16px;
				box-shadow: var(--shadow-sm);
			}
			.metric .n {
				font-size: 24px;
				font-weight: 850;
				line-height: 1;
			}
			.metric .l {
				font-size: 11.5px;
				color: var(--muted);
				margin-top: 6px;
			}
			.metric.accent {
				background: var(--secondary);
				border-color: var(--secondary);
				color: #fff;
			}
			.metric.accent .l {
				color: #c3ccd2;
			}
			/* ---------- workspace ---------- */
			.workspace {
				display: grid;
				grid-template-columns: 330px 1fr;
				gap: 18px;
				flex: 1;
				min-height: 0;
			}
			.panel {
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: 16px;
				box-shadow: var(--shadow);
				overflow: hidden;
				height: 100%;
				min-height: 0;
				display: flex;
				flex-direction: column;
			}
			.panelHead {
				padding: 14px 16px;
				border-bottom: 1px solid var(--line);
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 10px;
				flex: none;
			}
			.panelHead .ttl {
				font-weight: 850;
				font-size: 14px;
			}
			.panelHead .cnt {
				font-size: 11px;
				font-weight: 800;
				color: var(--muted);
				background: var(--card-alt);
				border-radius: 99px;
				padding: 2px 9px;
			}
			/* product list */
			.prodList {
				padding: 12px;
				flex: 1;
				min-height: 0;
				overflow-y: auto;
				display: flex;
				flex-direction: column;
				gap: 9px;
			}
			.prodCard {
				border: 1px solid var(--line);
				border-radius: 12px;
				padding: 12px;
				cursor: pointer;
				transition: 0.12s;
				background: var(--card);
			}
			.prodCard:hover {
				border-color: var(--input);
			}
			.prodCard.active {
				border-color: var(--primary);
				background: #fbf6f1;
				box-shadow: inset 3px 0 0 var(--primary);
			}
			.prodCard .nm {
				font-weight: 800;
				font-size: 13.5px;
			}
			.prodCard .mt {
				font-size: 11.5px;
				color: var(--muted);
				margin-top: 3px;
				display: flex;
				justify-content: space-between;
				gap: 8px;
			}
			.prodCard .total {
				color: var(--secondary);
				font-weight: 800;
			}
			.gcounts {
				display: flex;
				gap: 5px;
				flex-wrap: wrap;
				margin-top: 9px;
			}
			.gcount {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				font-size: 10.5px;
				font-weight: 750;
				color: var(--ink);
				background: var(--chip);
				border: 1px solid var(--secondary);
				border-radius: 7px;
				padding: 2px 7px;
			}
			.gnum {
				font-size: 10.5px;
				font-weight: 800;
				color: var(--secondary);
			}
			/* detail */
			.detailHead {
				padding: 16px 18px;
				border-bottom: 1px solid var(--line);
				flex: none;
			}
			.detailHead .nm {
				font-size: 17px;
				font-weight: 850;
			}
			.detailHead .mt {
				font-size: 12.5px;
				color: var(--muted);
				margin-top: 4px;
			}
			.bar {
				padding: 12px 18px;
				border-bottom: 1px solid var(--line);
				background: var(--chip);
				flex: none;
			}
			.barRow {
				display: flex;
				gap: 8px;
				align-items: center;
				flex-wrap: wrap;
			}
			.barRow + .barRow {
				margin-top: 10px;
			}
			.barLbl {
				font-size: 10.5px;
				text-transform: uppercase;
				letter-spacing: 0.6px;
				color: var(--muted);
				font-weight: 800;
				width: 86px;
				flex: none;
			}
			.chanTab {
				border: 1px solid var(--line);
				background: var(--card);
				border-radius: 99px;
				padding: 8px 16px;
				font-weight: 800;
				font-size: 12.5px;
				cursor: pointer;
				display: inline-flex;
				gap: 8px;
				align-items: center;
				color: var(--ink);
			}
			.chanTab.active {
				background: var(--primary);
				border-color: var(--primary);
				color: var(--primary-fg);
			}
			.chanTab .ct,
			.mpChip .ct {
				background: var(--card-alt);
				color: var(--ink);
				border-radius: 99px;
				padding: 0 7px;
				font-size: 11px;
				font-weight: 800;
			}
			.chanTab.active .ct,
			.mpChip.active .ct {
				background: rgba(255, 255, 255, 0.25);
				color: #fff;
			}
			.mpChip {
				border: 1px solid var(--line);
				background: var(--card);
				border-radius: 99px;
				padding: 6px 12px;
				font-weight: 700;
				font-size: 12px;
				cursor: pointer;
				display: inline-flex;
				gap: 7px;
				align-items: center;
				color: var(--ink);
			}
			.mpChip.active {
				background: var(--secondary);
				border-color: var(--secondary);
				color: #fff;
			}
			.detailBody {
				padding: 16px 18px 20px;
				flex: 1;
				min-height: 0;
				overflow-y: auto;
			}
			/* block (parent / variant) */
			.block {
				border: 1px solid var(--line);
				border-radius: 14px;
				margin-bottom: 15px;
				overflow: hidden;
			}
			.blockHead {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 12px;
				padding: 11px 15px;
				border-bottom: 1px solid var(--line);
				background: var(--chip);
				border-left: 4px solid var(--line);
				cursor: pointer;
			}
			.bcaret {
				color: var(--muted2);
				font-size: 11px;
				transition: 0.2s;
				display: inline-block;
			}
			.block.collapsed .blockHead {
				border-bottom: 0;
			}
			.block.collapsed .bcaret {
				transform: rotate(-90deg);
			}
			.block.collapsed .blockBody {
				display: none;
			}
			.blockHead.parent {
				border-left-color: var(--secondary-focus);
			}
			.blockHead.variant {
				border-left-color: var(--secondary-focus);
			}
			.blockTitle {
				display: flex;
				align-items: baseline;
				gap: 9px;
				flex-wrap: wrap;
			}
			.blockTitle .kind {
				font-size: 10px;
				font-weight: 800;
				text-transform: uppercase;
				letter-spacing: 0.6px;
				color: var(--muted);
			}
			.blockTitle .sku {
				font-size: 15px;
				font-weight: 850;
			}
			.blockTitle .desc {
				font-size: 12px;
				color: var(--muted);
			}
			.blockTitle .cnt {
				background: var(--card-alt);
				border-radius: 99px;
				padding: 1px 8px;
				font-size: 11px;
				font-weight: 800;
				color: var(--muted);
			}
			.blockBody {
				padding: 12px;
				display: flex;
				flex-direction: column;
				gap: 11px;
			}
			.note {
				color: var(--muted);
				font-size: 12px;
				font-style: italic;
				padding: 4px 2px;
			}
			/* group accordion */
			.group {
				border: 1px solid var(--line);
				border-radius: 12px;
				overflow: hidden;
			}
			.groupHead {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 10px 13px;
				cursor: pointer;
				gap: 12px;
				background: var(--card);
			}
			.groupHead .left {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.groupName {
				font-weight: 800;
				font-size: 13px;
			}
			.groupSub {
				font-size: 11px;
				color: var(--muted);
				margin-top: 1px;
			}
			.groupHead .right,
			.blockHead .right {
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.caret {
				color: var(--muted2);
				transition: 0.2s;
				font-size: 11px;
				margin-left: 2px;
			}
			.group.collapsed .caret {
				transform: rotate(-90deg);
			}
			.group.collapsed .groupBody {
				display: none;
			}
			.groupBody {
				border-top: 1px solid var(--line);
				padding: 11px;
				display: flex;
				flex-direction: column;
				gap: 10px;
				background: var(--chip);
			}
			/* change card */
			.chg {
				border: 1px solid var(--line);
				border-radius: 11px;
				background: var(--card);
				overflow: hidden;
			}
			.chgHead {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
				padding: 9px 12px;
				border-bottom: 1px solid var(--line);
			}
			.chgHead .l {
				display: flex;
				align-items: center;
				gap: 9px;
				min-width: 0;
			}
			.chk {
				display: none;
			}
			.chkbox {
				width: 22px;
				height: 22px;
				border-radius: 50%;
				background: var(--card-alt);
				border: 1px solid var(--line);
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				flex: none;
				transition: 0.12s;
				color: var(--primary-fg);
			}
			.chkbox svg {
				width: 12px;
				height: 12px;
				opacity: 0;
				transition: 0.12s;
			}
			.chk:checked + .chkbox {
				background: var(--primary);
				border-color: var(--primary);
			}
			.chk:checked + .chkbox svg {
				opacity: 1;
			}
			.chgTitle {
				font-weight: 800;
				font-size: 12.5px;
			}
			.info {
				width: 16px;
				height: 16px;
				border-radius: 50%;
				border: 1px solid var(--line);
				color: var(--muted2);
				font-size: 10px;
				font-weight: 800;
				font-style: italic;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				cursor: help;
				flex: none;
			}
			.info:hover {
				border-color: var(--primary);
				color: var(--primary);
			}
			.chgBody {
				padding: 11px 12px;
			}
			.cmp {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 11px;
			}
			.cmpCol strong {
				display: block;
				font-size: 9.5px;
				color: var(--muted2);
				text-transform: uppercase;
				letter-spacing: 0.4px;
				margin-bottom: 5px;
			}
			.cmpVal {
				font-size: 12.5px;
				border-radius: 9px;
				padding: 8px 11px;
				border: 1px solid var(--line);
				background: var(--bg);
				line-height: 1.5;
				word-break: break-word;
				min-height: 36px;
			}
			.cmpCol.c .cmpVal {
				background: var(--card);
				border-left: 2px solid var(--primary);
			}
			.ev {
				color: var(--muted2);
				font-style: italic;
			}
			.sep {
				color: var(--muted2);
				margin: 0 3px;
			}
			.tag {
				font-size: 10px;
				font-weight: 800;
				letter-spacing: 0.3px;
				padding: 2px 8px;
				border-radius: 99px;
				text-transform: uppercase;
			}
			.t-added {
				background: #e7f5ef;
				color: #2f8f73;
			}
			.t-removed {
				background: #fdecea;
				color: var(--destructive-dark);
			}
			/* pricing table */
			.ptable {
				border: 1px solid var(--line);
				border-radius: 10px;
				overflow: hidden;
				background: var(--card);
			}
			.phead,
			.prow {
				display: grid;
				grid-template-columns: 1.3fr 1fr 1fr;
				gap: 10px;
				padding: 9px 13px;
				align-items: start;
			}
			.phead {
				background: var(--card-alt);
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.5px;
				color: var(--muted);
				font-weight: 800;
			}
			.prow {
				border-top: 1px solid var(--line);
				font-size: 12.5px;
			}
			.prow.diff {
				background: var(--alert-bg);
			}
			.pl {
				font-weight: 750;
			}
			.pmeta {
				font-size: 10.5px;
				color: var(--muted);
				font-weight: 500;
				margin-top: 2px;
			}
			.pv {
				font-weight: 700;
			}
			.qd {
				font-size: 11.5px;
				line-height: 1.55;
			}
			/* media */
			.mediaGrid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 7px;
			}
			.media {
				aspect-ratio: 1;
				border-radius: 9px;
				border: 1px solid var(--line);
				background: linear-gradient(135deg, #ece6df, #f3ead9);
				position: relative;
				overflow: hidden;
				display: flex;
				align-items: flex-end;
				padding: 5px;
			}
			.media .fn {
				font-size: 8.5px;
				background: rgba(61, 80, 92, 0.62);
				color: #fff;
				padding: 1px 4px;
				border-radius: 4px;
				max-width: 100%;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.media.main:before {
				content: '★';
				position: absolute;
				top: 4px;
				left: 5px;
				color: var(--primary);
				font-size: 12px;
				text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
			}
			.media.removed {
				opacity: 0.45;
				filter: grayscale(0.5);
			}
			.media.gnew {
				outline: 2px solid var(--success);
				outline-offset: -2px;
			}
			.media .corner {
				position: absolute;
				top: 4px;
				right: 4px;
				font-size: 8px;
				font-weight: 800;
				color: #fff;
				padding: 1px 5px;
				border-radius: 99px;
			}
			.media.gnew .corner {
				background: var(--success);
			}
			.media.removed .corner {
				background: var(--destructive);
			}
			/* axes + wrapper */
			.axisLine {
				display: flex;
				gap: 7px;
				flex-wrap: wrap;
				align-items: center;
			}
			.axis {
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 5px 10px;
				background: var(--card);
				font-weight: 700;
				font-size: 12px;
			}
			.axis.add {
				background: #e7f5ef;
				border-color: #b9e3d3;
				color: #2f8f73;
			}
			.axis.rem {
				background: #fdecea;
				border-color: #f5c9c4;
				color: var(--destructive-dark);
				text-decoration: line-through;
			}
			.wrapBox {
				margin-top: 11px;
			}
			.wrapBox > .wl {
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.5px;
				color: var(--muted);
				font-weight: 800;
				margin-bottom: 6px;
			}
			.wrapTable {
				font-size: 12px;
			}
			.wrapTable .wr {
				display: grid;
				grid-template-columns: 130px 1fr 1fr;
				gap: 10px;
				padding: 5px 0;
				border-top: 1px solid var(--line);
			}
			.wrapTable .wr:first-child {
				border-top: 0;
			}
			.wrapTable .wk {
				color: var(--muted);
				font-weight: 700;
			}
			.empty {
				padding: 40px 24px;
				text-align: center;
				color: var(--muted);
				border: 1px dashed var(--line);
				border-radius: 14px;
				background: var(--chip);
			}
			.empty .big {
				font-size: 30px;
				color: var(--success);
			}
			.toastWrap {
				position: fixed;
				bottom: 22px;
				right: 22px;
				display: flex;
				flex-direction: column;
				gap: 9px;
				z-index: 50;
			}
			.toast {
				background: var(--secondary);
				color: #fff;
				padding: 12px 16px;
				border-radius: 12px;
				font-size: 12.5px;
				font-weight: 650;
				box-shadow: var(--shadow);
				display: flex;
				gap: 9px;
				align-items: center;
				animation: slidein 0.22s ease;
				max-width: 360px;
			}
			.toast .tdot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--success);
				flex: none;
			}
			.toast.warn .tdot {
				background: var(--alert);
			}
			@keyframes slidein {
				from {
					transform: translateY(10px);
					opacity: 0;
				}
			}
			@media (max-width: 1080px) {
				.cards {
					grid-template-columns: repeat(2, 1fr);
				}
				.workspace {
					grid-template-columns: 1fr;
				}
				.prodList {
					max-height: none;
				}
				.cmp {
					grid-template-columns: 1fr;
				}
				.mediaGrid {
					grid-template-columns: repeat(3, 1fr);
				}
			}
		</style>
	</head>

		<script>
			/* ============================================================
			 *  MOCK DATA — normalized to one flat change-record shape.

			 *  variant AND per marketplace. See delta-sync-review.md.

			let DID = 0;

			const amzPrice = (lp, op, sp, spS, spE, bb, cs, qd) => ({

			const products = [
				{

					deltas: [
						d({

						}),

			];

			/* ============================================================
			 *  LOGICAL GROUPS  (minimal palette — emoji differentiates)
			 * ============================================================ */
			const GROUPS = {
				attributes: { name: 'Attributes' },
				pricing: { name: 'Pricing' },
				media: { name: 'Media' },
				structure: { name: 'Variant Structure' },
				variantAttributes: { name: 'Variant Attributes' },
				miscellaneous: { name: 'Miscellaneous' },
			};
			const PARENT_GROUPS = ['attributes', 'pricing', 'media', 'miscellaneous'];
			const VARIANT_GROUPS = [
				'attributes',
				'pricing',
				'media',
				'structure',
				'variantAttributes',
				'miscellaneous',
			];

			/* ============================================================
			 *  STATE
			 * ============================================================ */
			let selectedId = products[0].id;
			let channel = 'AMAZON';
			let marketplace = 'US';
			const reverted = new Set();
			const deselected = new Set(); // ids NOT selected (default: everything selected)
			const collapsed = new Set(); // collapse keys (block / group), persisted across re-renders

			const cur = () => products.find((p) => p.id === selectedId);
			const live = (p) => p.deltas.filter((x) => !reverted.has(x.id));
			const isSelected = (x) => !deselected.has(x.id);
			// changes in the active Channel + Marketplace that are currently selected
			const viewSelected = (p) => p.deltas.filter((x) => inChannel(x) && isSelected(x));
			const scopeLabel = () => (channel === 'AMAZON' ? 'Amazon ' + marketplace : 'Shopify');
			// collapse keys are namespaced per view so state doesn't bleed across products/markets
			const viewKey = () => `${selectedId}|${channel}|${marketplace || ''}`;
			/**
			 * Toggle collapse for a block/group, persisting it in `collapsed` so a later
			 * re-render (e.g. selecting changes) keeps the open/closed state.
			 * @param {HTMLElement} headEl - the clicked header element
			 * @param {string} key - the collapse key
			 * @returns {void}
			 */
			function toggleCollapse(headEl, key) {
				const el = headEl.parentNode;
				if (collapsed.has(key)) {
					collapsed.delete(key);
					el.classList.remove('collapsed');
				} else {
					collapsed.add(key);
					el.classList.add('collapsed');
				}
			}

			function inChannel(x) {
				if (reverted.has(x.id)) return false;
				if (x.channel !== channel) return false;
				if (channel === 'AMAZON' && x.marketplace !== marketplace) return false;
				return true;
			}
			function inBlock(x, blockKey) {
				if (!inChannel(x)) return false;
				if (blockKey === 'parent') return x.level === 'product';
				return x.variantSku === blockKey.slice(8);
			}

			/* ---------- helpers ---------- */
			function esc(s) {
				return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
			}
			function val(v) {
				if (v === null || v === undefined || v === '') return '<em class="ev">(empty)</em>';
				if (Array.isArray(v)) return v.length ? v.map(esc).join(', ') : '<em class="ev">(empty)</em>';
				return esc(v);
			}
			function humanize(s) {
				return String(s)
					.replace(/_/g, ' ')
					.replace(/\b\w/g, (c) => c.toUpperCase());
			}

			/* ============================================================
			 *  LEFT CARD — product list
			 * ============================================================ */
			function groupCounts(p) {
				const out = {};
				live(p).forEach((x) => (out[x.group] = (out[x.group] || 0) + 1));
				return out;
			}
			function renderProductList() {
				prodCount.textContent = products.length;
				productList.innerHTML = products
					.map((p) => {
						const total = live(p).length;
						const gc = groupCounts(p);
						const chips = Object.keys(GROUPS)
							.filter((g) => gc[g])
							.map(
								(g) =>
									`<span class="gcount">${GROUPS[g].name}<span class="gnum">${gc[g]}</span></span>`,
							)
							.join('');
						return `<div class="prodCard ${p.id === selectedId ? 'active' : ''}" onclick="pickProduct(${p.id})">
							<div class="nm">${esc(p.name)}</div>
							<div class="mt"><span class="mono">${esc(p.sku)}</span><span class="total">${total} changes</span></div>
							<div class="gcounts">${chips}</div>
						</div>`;
					})
					.join('');
			}

			/* ============================================================

			 * ============================================================ */
			function renderBar() {
				const p = cur();
				let chans = p.channels
					.map((c) => {
						const cnt = live(p).filter((x) => x.channel === c.type).length;
						return `<button class="chanTab ${channel === c.type ? 'active' : ''}" onclick="setChannel('${c.type}')">
							${c.type === 'AMAZON' ? 'Amazon' : 'Shopify'} <span class="ct">${cnt}</span></button>`;
					})
					.join('');
				let html = `<div class="barRow"><span class="barLbl">Channel</span>${chans}</div>`;

				if (channel === 'AMAZON') {
					const mps = p.channels.find((c) => c.type === 'AMAZON').marketplaces;
					html += `<div class="barRow"><span class="barLbl">Marketplace</span>${mps
						.map((m) => {
							const cnt = live(p).filter((x) => x.channel === 'AMAZON' && x.marketplace === m).length;
							return `<button class="mpChip ${marketplace === m ? 'active' : ''}" onclick="setMarketplace('${m}')">
								${m} <span class="ct">${cnt}</span></button>`;
						})
						.join('')}</div>`;
				}
				bar.innerHTML = html;
			}

			/* ============================================================
			 *  RIGHT CARD — parent block + one block per variant
			 * ============================================================ */
			function renderDetail() {
				const p = cur();
				dName.textContent = p.name;
				const vc = new Set(
					live(p)
						.filter((x) => x.variantSku)
						.map((x) => x.variantSku),
				).size;
				dMeta.innerHTML = `<span class="mono">${esc(p.sku)}</span> · ${p.channels.map((c) => c.type).join(' + ')} · ${vc ? vc + ' variant(s) changed' : 'no variants'}`;

				const recs = live(p).filter(inChannel);
				const where = channel === 'AMAZON' ? 'Amazon ' + marketplace : 'Shopify';
				if (!recs.length) {
					detailBody.innerHTML = `<div class="empty"><div class="big">✓</div>
						<div style="margin-top:8px;font-weight:700">No changes for ${where}.</div>
						<div style="font-size:12px;margin-top:4px">Nothing changed for this product on ${where} since the last sync.</div></div>`;
					return;
				}

				let html = '';
				const parent = recs.filter((x) => x.level === 'product');
				if (parent.length) html += renderBlock('parent', 'parent', esc(p.sku), '', parent, PARENT_GROUPS);
				else html += `<div class="note">No parent-level changes for ${where} — variant changes only.</div>`;

				p.variants.forEach((v) => {
					const vDeltas = recs.filter((x) => x.variantSku === v.sku);
					if (vDeltas.length)
						html += renderBlock(
							'variant:' + v.sku,
							'variant',
							esc(v.sku),
							esc(v.desc),
							vDeltas,
							VARIANT_GROUPS,
						);
				});
				detailBody.innerHTML = html;
			}

			function renderBlock(blockKey, kind, mainTitle, sub, deltas, groupList) {
				const groupsHtml = groupList
					.map((gKey) => {
						const items = deltas.filter((x) => x.group === gKey);
						return items.length ? renderGroup(blockKey, gKey, items) : '';
					})
					.join('');
				const isVar = kind === 'variant';
				const sel = deltas.filter(isSelected).length;
				const ck = `${viewKey()}|${blockKey}`;
				return `<div class="block ${collapsed.has(ck) ? 'collapsed' : ''}">
					<div class="blockHead ${kind}" onclick="toggleCollapse(this,'${ck}')">
						<div class="blockTitle">
							<span class="bcaret">▼</span>
							<span class="kind">${isVar ? 'Variant' : 'Parent'}</span>
							<span class="sku mono">${mainTitle}</span>
							${sub ? `<span class="desc">${sub}</span>` : ''}
							<span class="cnt">${deltas.length} change${deltas.length > 1 ? 's' : ''} · ${sel} selected</span>
						</div>
						<div class="right" onclick="event.stopPropagation()">
							<button class="btn small ghost" onclick="setBlock('${blockKey}',true)">Select all</button>
							<button class="btn small ghost" onclick="setBlock('${blockKey}',false)">Deselect all</button>
							<button class="btn small danger" onclick="revertBlock('${blockKey}')">↺ Revert ${isVar ? 'variant' : 'parent'}</button>
						</div>
					</div>
					<div class="blockBody">${groupsHtml}</div>
				</div>`;
			}

			function renderGroup(blockKey, gKey, items) {
				const g = GROUPS[gKey];
				const sel = items.filter(isSelected).length;
				const ck = `${viewKey()}|${blockKey}::${gKey}`;
				return `<div class="group ${collapsed.has(ck) ? 'collapsed' : ''}">
					<div class="groupHead" onclick="toggleCollapse(this,'${ck}')">
						<div class="left">
							<div>
								<div class="groupName">${g.name}</div>
								<div class="groupSub">${items.length} change${items.length > 1 ? 's' : ''} · ${sel} selected</div>
							</div>
						</div>
						<div class="right" onclick="event.stopPropagation()">
							<button class="btn small ghost" onclick="setGroup('${blockKey}','${gKey}',true)">Select all</button>
							<button class="btn small ghost" onclick="setGroup('${blockKey}','${gKey}',false)">Deselect all</button>
							<button class="btn small danger" onclick="revertGroup('${blockKey}','${gKey}')">↺ Revert group</button>
							<span class="caret">▼</span>
						</div>
					</div>
					<div class="groupBody">${items.map(renderCard).join('')}</div>
				</div>`;
			}

			/* ---------- one change card ---------- */
			function renderCard(x) {
				let title,
					info = '',
					chip = '',
					body;
				if (x.group === 'attributes' || x.group === 'variantAttributes') {
					title = x.label;
					info = `<span class="info" title="internal name: ${esc(x.name)}">i</span>`;
					if (x.changeType === 'added') chip = '<span class="tag t-added">Added</span>';
					else if (x.changeType === 'removed') chip = '<span class="tag t-removed">Removed</span>';
					body = cmp(x.original, x.current);
				} else if (x.group === 'pricing') {
					title = 'Price structure';
					body = renderPrice(x);
				} else if (x.group === 'media') {
					title = 'Media gallery';
					body = renderMedia(x);
				} else if (x.group === 'structure') {
					title = 'Variation structure';
					body = renderStructure(x);
				} else {
					title = x.label || humanize(x.baselineType);
					body = renderMisc(x);
				}

				return `<div class="chg">
					<div class="chgHead">
						<div class="l">
							<input class="chk" id="chk-${x.id}" type="checkbox" ${isSelected(x) ? 'checked' : ''} onchange="toggleRow(${x.id}, this.checked)" />
							<label class="chkbox" for="chk-${x.id}" title="Select">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>
							</label>
							<span class="chgTitle">${esc(title)}</span>${info}${chip}
						</div>
						<button class="btn small danger" onclick="revertChange(${x.id})">↺ Revert</button>
					</div>
					<div class="chgBody">${body}</div>
				</div>`;
			}

			function cmp(o, c) {
				return `<div class="cmp">
					<div class="cmpCol o"><strong>Original</strong><div class="cmpVal">${val(o)}</div></div>
					<div class="cmpCol c"><strong>Current</strong><div class="cmpVal">${val(c)}</div></div>
				</div>`;
			}

			/* ---------- pricing ---------- */
			function renderPrice(x) {
				const amazon = x.channel === 'AMAZON';
				const o = x.original || {},
					c = x.current || {};
				const line = (label, ov, cv, meta) => {
					const diff = String(ov ?? '') !== String(cv ?? '');
					return `<div class="prow ${diff ? 'diff' : ''}">
						<div class="pl">${label}${meta ? `<div class="pmeta">${meta}</div>` : ''}</div>
						<div class="pv o">${val(ov)}</div>
						<div class="pv c">${val(cv)}</div></div>`;
				};
				const dates = (sp) =>
					sp && (sp.startDate || sp.endDate) ? `${sp.startDate || '…'} → ${sp.endDate || '…'}` : '';
				const qd = (arr) =>
					arr && arr.length
						? `<span class="qd">${arr.map((q) => `Qty ≥${q.quantity}: ${q.price}${q.priceType === 'percent' ? '%' : ' (fixed)'}`).join('<br>')}</span>`
						: '<em class="ev">(empty)</em>';

				let rows = line('List price', o.listPrice?.price, c.listPrice?.price);
				rows += line('Offer price', o.offerPrice?.price, c.offerPrice?.price);
				if (amazon) {
					const dm =
						dates(o.salePrice) || dates(c.salePrice)
							? `Original: ${dates(o.salePrice) || '—'} · Current: ${dates(c.salePrice) || '—'}`
							: '';
					rows += line('Sale price', o.salePrice?.price, c.salePrice?.price, dm);
					rows += line(
						'Business base price',
						o.businessPrice?.baseBusinessPrice,
						c.businessPrice?.baseBusinessPrice,
					);
					rows += line(
						'Consumer sale price',
						o.businessPrice?.consumerSalePrice,
						c.businessPrice?.consumerSalePrice,
					);
					const qo = qd(o.businessPrice?.quantityDiscount),
						qc = qd(c.businessPrice?.quantityDiscount);
					rows += `<div class="prow ${qo !== qc ? 'diff' : ''}"><div class="pl">Quantity discounts</div><div class="pv o">${qo}</div><div class="pv c">${qc}</div></div>`;
				}
				return `<div class="ptable"><div class="phead"><span>Price type</span><span>Original</span><span>Current</span></div>${rows}</div>`;
			}

			/* ---------- media ---------- */
			function renderMedia(x) {
				const oN = x.original.map((m) => m.name),
					cN = x.current.map((m) => m.name);
				const cell = (m, cls) => {
					const corner =
						cls === 'gnew'
							? '<span class="corner">NEW</span>'
							: cls === 'removed'
								? '<span class="corner">DEL</span>'
								: '';
					return `<div class="media ${m.main ? 'main' : ''} ${cls}">${corner}<span class="fn">${esc(m.name)}</span></div>`;
				};
				return `<div class="cmp">
					<div class="cmpCol o"><strong>Original</strong><div class="mediaGrid">${x.original.map((m) => cell(m, cN.includes(m.name) ? '' : 'removed')).join('')}</div></div>
					<div class="cmpCol c"><strong>Current</strong><div class="mediaGrid">${x.current.map((m) => cell(m, oN.includes(m.name) ? '' : 'gnew')).join('')}</div></div>
				</div>`;
			}

			/* ---------- variant structure ---------- */
			function renderStructure(x) {
				const o = x.original,
					c = x.current;
				const oL = o.axes.map((a) => a.label),
					cL = c.axes.map((a) => a.label);
				const axisChips = (axes, otherLabels, addClass) =>
					axes
						.map(
							(a) =>
								`<span class="axis ${!otherLabels.includes(a.label) ? addClass : ''}" title="${esc(a.name)}">${esc(a.label)}</span>`,
						)
						.join('') || '<em class="ev">(empty)</em>';

				let html = `<div class="cmp">
					<div class="cmpCol o"><strong>Original axes</strong><div class="cmpVal"><div class="axisLine">${axisChips(o.axes, cL, 'rem')}</div></div></div>
					<div class="cmpCol c"><strong>Current axes</strong><div class="cmpVal"><div class="axisLine">${axisChips(c.axes, oL, 'add')}</div></div></div>
				</div>`;

				if (x.channel === 'AMAZON') {
					const wr = (k, ov, cv) =>
						`<div class="wr"><span class="wk">${k}</span><span>${val(ov)}</span><span>${val(cv)}</span></div>`;
					const ow = o.wrapper,
						cw = c.wrapper;
					html += `<div class="wrapBox"><div class="wl">Parent wrapper (Amazon)</div>
						<div class="wrapTable">
							<div class="wr"><span class="wk"></span><span class="wk">Original</span><span class="wk">Current</span></div>
							${wr('Parent SKU', ow?.sku, cw?.sku)}
							${wr('ASIN', ow?.asin, cw?.asin)}
							${wr('Variation theme', ow?.variationTheme, cw?.variationTheme)}
						</div></div>`;
				}
				return html;
			}

			/* ---------- miscellaneous (baselineType-driven) ---------- */
			function renderMisc(x) {
				if (x.baselineType === 'category' || x.baselineType === 'shopify_category') {
					const path = (a) =>
						a && a.length ? a.map(esc).join('<span class="sep">›</span>') : '<em class="ev">(empty)</em>';
					return `<div class="cmp">
						<div class="cmpCol o"><strong>Original path</strong><div class="cmpVal">${path(x.original)}</div></div>
						<div class="cmpCol c"><strong>Current path</strong><div class="cmpVal">${path(x.current)}</div></div>
					</div>`;
				}
				// tags / condition_type / anything else → generic Original/Current
				return cmp(x.original, x.current);
			}

			/* ============================================================
			 *  METRICS
			 * ============================================================ */
			function renderMetrics() {
				const p = cur();
				mProducts.textContent = products.filter((x) => live(x).length).length;
				const view = live(p).filter(inChannel);
				mView.textContent = view.length;
				mVariants.textContent = new Set(view.filter((x) => x.variantSku).map((x) => x.variantSku)).size;
				// selection is scoped to the active Channel + Marketplace view
				const selCount = viewSelected(p).length;
				mApproved.textContent = selCount;
				const scope = scopeLabel();
				btnSync.textContent = `Sync selected · ${scope} (${selCount})`;
				btnRevertSel.textContent = `↺ Revert selected · ${scope} (${selCount})`;
			}

			/* ============================================================
			 *  ACTIONS
			 * ============================================================ */
			function pickProduct(id) {
				selectedId = id;
				const p = cur();
				channel = p.channels[0].type;
				marketplace = channel === 'AMAZON' ? p.channels[0].marketplaces[0] : null;
				renderAll();
			}
			function setChannel(c) {
				channel = c;
				const p = cur();
				marketplace = c === 'AMAZON' ? p.channels.find((ch) => ch.type === 'AMAZON').marketplaces[0] : null;
				renderAll();
			}
			function setMarketplace(m) {
				marketplace = m;
				renderAll();
			}
			function toggleRow(id, checked) {
				checked ? deselected.delete(id) : deselected.add(id);
				renderAll();
			}
			function setBlock(blockKey, select) {
				cur()
					.deltas.filter((x) => inBlock(x, blockKey))
					.forEach((x) => (select ? deselected.delete(x.id) : deselected.add(x.id)));
				renderAll();
			}
			function setGroup(blockKey, gKey, select) {
				cur()
					.deltas.filter((x) => inBlock(x, blockKey) && x.group === gKey)
					.forEach((x) => (select ? deselected.delete(x.id) : deselected.add(x.id)));
				renderAll();
			}
			function revertChange(id) {
				reverted.add(id);
				deselected.delete(id);
				toast('Change reverted to its last synced value');
				renderAll();
			}
			function revertGroup(blockKey, gKey) {
				const hit = cur().deltas.filter((x) => inBlock(x, blockKey) && x.group === gKey);
				hit.forEach((x) => reverted.add(x.id));
				toast(`Reverted ${hit.length} change(s) in "${GROUPS[gKey].name}"`, 'warn');
				renderAll();
			}
			function revertBlock(blockKey) {
				const hit = cur().deltas.filter((x) => inBlock(x, blockKey));
				const label = blockKey === 'parent' ? 'parent' : blockKey.slice(8);
				const where = channel === 'AMAZON' ? 'Amazon ' + marketplace : 'Shopify';
				if (!confirm(`Revert all ${hit.length} change(s) for ${label} on ${where}?`)) return;
				hit.forEach((x) => reverted.add(x.id));
				toast(`Reverted ${hit.length} change(s) for ${label} (${where})`, 'warn');
				renderAll();
			}
			function revertSelected() {
				const p = cur();
				const where = scopeLabel();
				const hit = viewSelected(p);
				if (!hit.length) return toast(`No selected changes to revert on ${where}`, 'warn');
				if (!confirm(`Revert ${hit.length} selected change(s) for "${p.name}" on ${where}?`)) return;
				hit.forEach((x) => reverted.add(x.id));
				toast(`Reverted ${hit.length} selected change(s) on ${where}`, 'warn');
				renderAll();
			}
			function revertProduct() {
				const p = cur();
				const hit = live(p);
				if (!hit.length) return toast('Nothing to revert', 'warn');
				if (!confirm(`Revert ALL ${hit.length} changes for "${p.name}" across every channel & marketplace?`))
					return;
				hit.forEach((x) => reverted.add(x.id));
				toast(`Whole product reverted (${hit.length} changes)`, 'warn');
				renderAll();
			}
			function syncProduct() {
				const p = cur();
				const where = scopeLabel();
				const approved = viewSelected(p);
				if (!approved.length) return toast(`No selected changes to sync on ${where}`, 'warn');
				toast(`Syncing ${approved.length} selected change(s) for "${p.name}" on ${where}`);
			}

			function toast(msg, kind) {
				const el = document.createElement('div');
				el.className = 'toast ' + (kind || '');
				el.innerHTML = `<span class="tdot"></span>${esc(msg)}`;
				toastWrap.appendChild(el);
				setTimeout(() => el.remove(), 3200);
			}

			function renderAll() {
				renderProductList();
				renderBar();
				renderDetail();
				renderMetrics();
			}
			pickProduct(products[0].id);
		</script>
	</body>
</html>
